<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{width}}, height={{height}}" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: {{width}}px;
        height: {{height}}px;
        overflow: hidden;
        background: {{background}};
        font-family: "Georgia", "Times New Roman", serif;
      }
      .scene {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        gap: 40px;
        padding: 160px;
      }
      .mark {
        font-size: 220px;
        line-height: 0.6;
        color: {{accent}};
        font-weight: 700;
      }
      .quote {
        font-size: 82px;
        font-weight: 500;
        line-height: 1.25;
        max-width: 1450px;
        color: #f2f0ea;
      }
      .author {
        font-family: "Inter", system-ui, sans-serif;
        font-size: 40px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: {{accent}};
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="{{duration}}"
      data-width="{{width}}"
      data-height="{{height}}"
    >
      <div class="scene">
        <div class="mark" id="mark">&ldquo;</div>
        <div class="quote" id="quote">{{quote}}</div>
        <div class="author" id="author">{{author}}</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const D = {{duration}};
      const tl = gsap.timeline({ paused: true });
      tl.from("#mark", { opacity: 0, y: -30, duration: 0.5, ease: "power2.out" }, 0);
      tl.from("#quote", { opacity: 0, y: 40, duration: 0.9, ease: "power3.out" }, 0.2);
      tl.from("#author", { opacity: 0, x: -30, duration: 0.6, ease: "power3.out" }, 0.7);
      tl.to("#quote", { opacity: 0, y: -26, duration: 0.5, ease: "power2.in" }, Math.max(1.2, D - 0.6));
      tl.to("#author", { opacity: 0, duration: 0.4, ease: "power2.in" }, Math.max(1.25, D - 0.55));
      tl.to("#mark", { opacity: 0, duration: 0.4, ease: "power2.in" }, Math.max(1.3, D - 0.5));
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
