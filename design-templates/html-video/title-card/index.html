<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{width}}, height={{height}}" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: {{width}}px;
        height: {{height}}px;
        overflow: hidden;
        background: {{background}};
        font-family: "Inter", system-ui, sans-serif;
      }
      .scene {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 28px;
        padding: 120px;
        text-align: center;
      }
      .rule {
        width: 88px;
        height: 6px;
        border-radius: 999px;
        background: {{accent}};
        transform-origin: center;
      }
      .title {
        font-size: 132px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.02;
        max-width: 1500px;
        color: #f4f6fb;
      }
      .subtitle {
        font-size: 46px;
        font-weight: 500;
        letter-spacing: 0.01em;
        max-width: 1200px;
        color: {{accent}};
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="{{duration}}"
      data-width="{{width}}"
      data-height="{{height}}"
    >
      <div class="scene">
        <div class="rule" id="rule"></div>
        <div class="title" id="title">{{title}}</div>
        <div class="subtitle" id="subtitle">{{subtitle}}</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const D = {{duration}};
      const tl = gsap.timeline({ paused: true });
      tl.from("#rule", { scaleX: 0, opacity: 0, duration: 0.5, ease: "power3.out" }, 0);
      tl.from("#title", { y: 60, opacity: 0, duration: 0.7, ease: "power3.out" }, 0.15);
      tl.from("#subtitle", { y: 40, opacity: 0, duration: 0.6, ease: "power3.out" }, 0.35);
      // Gentle settle, then a decisive exit near the end of the composition.
      tl.to("#title", { y: -36, opacity: 0, duration: 0.45, ease: "power2.in" }, Math.max(0.8, D - 0.6));
      tl.to("#subtitle", { y: -28, opacity: 0, duration: 0.4, ease: "power2.in" }, Math.max(0.85, D - 0.55));
      tl.to("#rule", { scaleX: 0, opacity: 0, duration: 0.4, ease: "power2.in" }, Math.max(0.9, D - 0.5));
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
